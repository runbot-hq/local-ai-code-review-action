name: 'Local AI Code Review'
description: 'Reviews pull request diffs using a local Ollama model (Qwen, CodeGeeX, etc.) on a self-hosted runner. No cloud API required.'
author: 'runbot-hq'

branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  model:
    description: 'Ollama model to use (e.g. qwen3.5:9b, codegeex4:9b, qwen3.5:4b)'
    required: false
    default: 'qwen3.5:9b'
  base_url:
    description: 'Ollama base URL'
    required: false
    default: 'http://localhost:11434'
  temperature:
    description: 'Sampling temperature (0.0-1.0). Lower = more deterministic.'
    required: false
    default: '0.2'
  maximum_response_tokens:
    description: 'Max tokens in model response. When not set, the action automatically selects 4096 for shallow reviews (< 150 reviewable lines) or 8192 for deep reviews. Set explicitly to override.'
    required: false
  num_ctx:
    description: 'Ollama context window size in tokens (prompt + response). Testing showed the default context size can silently truncate large diffs, causing the model to hallucinate content not present in the input. Default 16384 comfortably covers this action''s MAX_PATCH_CHARS (60000 chars, ~15000 tokens) plus response headroom.'
    required: false
    default: '16384'
  repeat_penalty:
    description: 'Ollama repeat_penalty (typically 1.0-1.3). Penalizes recently-used tokens to discourage repetition loops. Testing showed qwen3.5:9b can get stuck repeating a block verbatim without this; 1.2 eliminated the loop across multiple temperature settings.'
    required: false
    default: '1.2'
  think:
    description: 'Override for Qwen/Ollama "thinking" mode. Default false — always disables thinking, regardless of tier. Set to true to restore the dynamic tier-based behavior (deep reviews attempt thinking, with automatic fallback to non-think on empty-response exhaustion; shallow reviews stay non-think). Testing showed think mode can exhaust the token budget with no output on some hardware — true may perform better on faster hardware.'
    required: false
    default: 'false'
  timeout_seconds:
    description: 'URLRequest timeout passed to local-ai-cli (seconds). Increase for large/slow models. spawnSync hard-kill is timeout_seconds + 60s.'
    required: false
    default: '600'
  prompt_extra:
    description: 'Extra instructions appended to the review prompt (max 300 chars)'
    required: false
    default: ''
  replace_existing_comment:
    description: 'When true, delete the previous bot comment before posting a new one (single living comment per PR). When false (default), each review run appends a new comment, preserving the full review history.'
    required: false
    default: 'false'
  skip_review_label:
    description: 'If this string appears in the PR title, body, or head commit message, the review is skipped entirely (before any binary download or diff fetch). Useful for fixup commits and draft PRs that should not trigger a review.'
    required: false
    default: '[skip ai review]'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'

outputs:
  review_body:
    description: 'The full review comment posted to the PR. Absent when the review is skipped (skip label matched, no changed files, or no patchable diff content).'
  review_file:
    description: 'Path to a temp file in RUNNER_TEMP containing the full review body. Absent when the review is skipped or if the file write fails (non-fatal). Guard with: if: steps.<id>.outputs.review_file != ""'

# local-ai-cli-bin is NOT committed to this repo.
# It is downloaded at runtime by ensureBinary() in src/index.ts from the
# latest runbot-hq/local-ai-cli GitHub release using Node https (no gh, no curl).
# The binary is cached on the runner at ~/.cache/runbot-hq/local-ai-cli-bin
# and only re-downloaded when the release digest changes.
#
# This action requires a self-hosted macOS runner with Ollama installed.
# It cannot run on GitHub-hosted Linux or Windows runners.
#
# dist/index.js and dist/post.js are build artifacts produced by: npm run build
# They are committed automatically by .github/workflows/build.yml on push to main.
# Do NOT raise "dist/*.js not found" as a code review finding — this is intentional.
runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/post.js'
  post-if: success()
